services:
  camera-monitor:
    build: .
    container_name: camera-monitor
    restart: unless-stopped
    ports:
      - "1000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Yekaterinburg
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge
