<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная | Camera Monitor</title>
    <style>
        body { font-family: Arial; background: #1a1a1a; color: #eee; padding: 30px; margin: 0; }
        h1 { margin-bottom: 20px; }
        .device {
            background: #2a2a2a; border: 1px solid #444; border-radius: 10px;
            padding: 20px; margin: 15px 0; cursor: pointer; transition: background 0.2s;
        }
        .device:hover { background: #333; }
        .online { color: #4caf50; }
        .offline { color: #f44336; }
        .metrics { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 10px; }
        .metric { background: #1e1e1e; padding: 10px 15px; border-radius: 6px; }
        .metric span { display: block; font-size: 14px; color: #aaa; }
        .metric strong { font-size: 18px; }
    </style>
</head>
<body>
    <h1>📡 Устройства Orange Pi</h1>
    <div id="devices">Загрузка...</div>
    <script>
        async function load() {
            try {
                const res = await fetch('/api/orangepi');
                const data = await res.json();
                const container = document.getElementById('devices');
                container.innerHTML = '';
                data.forEach(pi => {
                    const div = document.createElement('div');
                    div.className = 'device';
                    div.onclick = () => location.href = `/device/${pi.id}`;
                    div.innerHTML = `
                        <h2>${pi.name} <span class="${pi.status}">(${pi.status})</span></h2>
                        <p>IP: ${pi.ip}</p>
                        <div class="metrics">
                            <div class="metric"><span>CPU</span><strong>${pi.cpu_usage.toFixed(1)}%</strong></div>
                            <div class="metric"><span>RAM</span><strong>${pi.ram_usage.toFixed(1)}%</strong></div>
                            <div class="metric"><span>Disk</span><strong>${pi.disk_usage.toFixed(1)}%</strong></div>
                            <div class="metric"><span>Temp</span><strong>${pi.temperature.toFixed(1)}°C</strong></div>
                        </div>
                        <p>Камер: ${pi.camera_count}</p>
                    `;
                    container.appendChild(div);
                });
            } catch(e) {
                document.getElementById('devices').innerText = 'Ошибка загрузки';
            }
        }
        load();
        setInterval(load, 30000);
    </script>
</body>
</html>
