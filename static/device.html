<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Устройство | Camera Monitor</title>
<style>
    body { font-family: Arial; background: #1a1a1a; color: #eee; padding: 20px; }
    .camera { background: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 15px; margin: 10px 0; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn { background: #4caf50; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .gallery img { max-width: 200px; border-radius: 4px; }
</style>
</head>
<body>
<a href="/" class="btn">⬅ Назад</a>
<h1>📹 Устройство #<span id="piId"></span></h1>
<p id="lastSeenDevice">Загрузка...</p>
<button class="btn" onclick="openScanModal()">🔍 Сканировать камеры</button>
<button class="btn" onclick="syncDevice()">🔄 Синхронизировать</button>
<h2>Камеры</h2><div id="cameras">Загрузка...</div>
<h2>Галерея</h2><div class="gallery" id="gallery"></div>
<script>
    const piId = window.location.pathname.split('/')[2];
    document.getElementById('piId').innerText = piId;
    function updateDeviceLastSeen() {
        fetch(`/api/orangepi/${piId}`).then(r=>r.json()).then(pi=>{
            document.getElementById('lastSeenDevice').innerText = 'Последняя активность: ' + new Date(pi.last_heartbeat).toLocaleString();
        });
    }
    async function loadCameras() {
        const res = await fetch(`/api/orangepi/${piId}/cameras`);
        const cams = await res.json();
        document.getElementById('cameras').innerHTML = cams.map(c=>`<div class="camera"><b>${c.name}</b></div>`).join('') || 'Нет камер';
    }
    async function loadGallery() {
        const res = await fetch(`/api/screenshots?device_id=${piId}&limit=50`);
        const data = await res.json();
        document.getElementById('gallery').innerHTML = data.items.map(s=>`<img src="${s.url}" title="${s.description||''}">`).join('');
    }
    function syncDevice() { fetch(`/api/orangepi/${piId}/sync`, {method:'POST'}); alert('Команда отправлена'); }
    function openScanModal() { alert('Сканирование запущено (заглушка)'); }
    updateDeviceLastSeen(); loadCameras(); loadGallery();
</script>
</body>
</html>
