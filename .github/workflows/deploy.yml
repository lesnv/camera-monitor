name: Deploy to server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
               -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
               -H "Content-Type: application/json" \
               --fail
